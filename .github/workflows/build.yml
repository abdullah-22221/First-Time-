name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create base project
        run: flutter create --org com.asplayer --project-name as_player --platforms android build_app
      - name: Copy my files
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib
          cp -r lib build_app/lib
      - name: Patch manifest
        run: cd build_app && python3 ../patch.py
      - name: Build
        run: cd build_app && flutter pub get && flutter build apk --release --target-platform android-arm,android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: AS-Player-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
